apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: todo-flaskapp-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: todo-flaskapp             # Must match deployment name exactly
  minReplicas: 1                    # Minimum pods running at all times
  maxReplicas: 7                    # Maximum pods (as required by assignment)
  metrics:
    - type: Resource
      resource:
        name: memory                # Scale based on MEMORY (assignment requirement)
        target:
          type: Utilization
          averageUtilization: 60    # Scale up when memory usage exceeds 60%