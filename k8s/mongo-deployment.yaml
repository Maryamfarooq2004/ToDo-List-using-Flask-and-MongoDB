apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
  labels:
    io.kompose.service: mongo
spec:
  replicas: 1                      # Database always stays at 1 replica
  selector:
    matchLabels:
      io.kompose.service: mongo
  strategy:
    type: Recreate                 # Recreate ensures only 1 DB pod at a time
  template:
    metadata:
      labels:
        io.kompose.service: mongo
    spec:
      containers:
        - name: mongo
          image: mongo:6.0          # Official MongoDB image (more stable)
          ports:
            - containerPort: 27017
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            - mountPath: /data/db   # MongoDB stores all data here
              name: flaskapp
      restartPolicy: Always
      volumes:
        - name: flaskapp
          persistentVolumeClaim:
            claimName: flaskapp     # Attach the PVC so data survives restarts