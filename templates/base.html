<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>{{ t }}</title>
	<link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='assets/style.css') }}">
</head>
<body>
	<div class="bg-orb orb-one"></div>
	<div class="bg-orb orb-two"></div>
	<div class="bg-grid"></div>

	<div class="shell">
		<header class="topbar">
			<a class="brand" href="/list#hero">
				<span class="brand-mark">✦</span>
				<span class="brand-copy">
					<span class="brand-kicker">Aurora Atelier</span>
					<span class="brand-title">{{ h }}</span>
				</span>
			</a>
			<nav class="nav">
				<a href="/list#task-board" class="nav-link {% if a1 %}is-active{% endif %}">All tasks</a>
				<a href="/#task-board" class="nav-link {% if a2 %}is-active{% endif %}">Open work</a>
				<a href="/completed#task-board" class="nav-link {% if a3 %}is-active{% endif %}">Completed</a>
				<a href="/about#credits" class="nav-link">About</a>
			</nav>
		</header>

		<main class="page">
			{% block content %}{% endblock %}
		</main>
	</div>
</body>
</html>
