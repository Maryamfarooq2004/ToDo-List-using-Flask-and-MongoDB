apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: {{ .Values.flaskapp.name }}
  name: {{ .Values.flaskapp.name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: {{ .Values.flaskapp.name }}
  strategy: {}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: {{ .Values.flaskapp.name }}
    spec:
      containers:
        - name: {{ .Values.flaskapp.name }}
          image: {{ template "flaskapp.image" . }}
          env:
            - name: FLASK_ENV
              value: {{ .Values.flaskapp.env }}
            - name: MONGO_URI
              value: mongodb://{{ .Values.mongo.name }}:{{ .Values.mongo.service.port }}/
            - name: PORT
              value: {{ .Values.flaskapp.service.port | quote }}
          ports:
            - containerPort: {{ .Values.flaskapp.service.port }}
          resources: {}
      restartPolicy: Always
status: {}
